<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4ef;
    --panel: #ffffff;
    --accent: #2d6a4f;
    --accent2: #52b788;
    --text: #1a1a1a;
    --muted: #7a7a72;
    --border: #e0dbd2;
    --shadow: 0 2px 16px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow); z-index: 1000; gap: 16px;
  }
  .header-left { display: flex; align-items: center; gap: 0px; }
  .logo { font-family: 'DM Serif Display', serif; font-size: 1.4rem; color: var(--accent); letter-spacing: -0.02em; }
  .logo-short { display: none; }
  .panel-toggle-wrap { display: flex; align-items: center; gap: 10px; }
  .status { font-size: 0.75rem; color: var(--muted); white-space: nowrap; margin-left: 12px; }
  .status.loading { color: var(--accent2); }
  .status.error { color: #c0392b; }

    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; border-radius: 50%;
    border: 1.5px solid var(--muted); color: var(--muted);
    font-size: 0.6rem; font-weight: 700; cursor: default;
    position: relative; flex-shrink: 0; line-height: 1;
    vertical-align: middle; margin-left: 5px;
  }
  .info-icon hr {
    opacity: 0.2;
  }
  .info-icon .info-tooltip {
    display: none;
    position: absolute; left: 50%; top: calc(100% + 8px);
    transform: translateX(-50%);
    background: var(--text); color: #fff;
    font-size: 0.75rem; font-weight: 400; line-height: 1.5;
    padding: 9px 12px; border-radius: 8px;
    width: 280px; white-space: normal; z-index: 9999;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);

  }
  .info-icon .info-tooltip::after {
    content: ''; position: absolute; bottom: 100%; left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent; border-bottom-color: var(--text);
  }
  .info-icon:hover .info-tooltip { display: block; } */

  .controls { display: flex; gap: 10px; align-items: center; }
  .btn-refresh {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 7px 14px; font-family: inherit; font-size: 0.85rem; cursor: pointer;
    font-weight: 500; transition: background 0.2s;
  }
  .btn-refresh:hover { background: var(--accent2); }

  .progress-bar {
    height: 3px; background: var(--border); position: relative; overflow: hidden;
    transition: opacity 0.3s;
  }
  .progress-bar.hidden { opacity: 0; }
  .progress-fill {
    height: 100%; background: var(--accent2);
    transition: width 0.3s ease; width: 0%;
  }

  #map { flex: 1; }

  .leaflet-tooltip {
    white-space: break-spaces;
    width: 220px;
    text-align: center;
  }
  /* Leaflet popup custom styles */
  .leaflet-popup-content-wrapper {
    border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.13); padding: 0; overflow: hidden;
  }
  .leaflet-popup-content { margin: 0; min-width: 220px; max-width: 300px; }
  .popup-inner { padding: 16px 18px; }
  .popup-name { font-family: 'DM Serif Display', serif; font-size: 1.05rem; color: var(--accent); margin-bottom: 6px; }
  .popup-loc { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
  .popup-desc { font-size: 0.82rem; line-height: 1.5; color: #444; margin-bottom: 10px; }
  .popup-contact { font-size: 0.8rem; display: flex; flex-direction: column; gap: 3px; }
  .popup-contact a { color: var(--accent); text-decoration: none; }
  .popup-contact a:hover { text-decoration: underline; }
  .popup-fallback-note { font-size: 0.72rem; color: var(--muted); font-style: italic; margin-top: 6px; }

  .popup-cluster { padding: 14px 16px; }
  .popup-cluster-title { font-family: 'DM Serif Display', serif; font-size: 1rem; color: var(--accent); margin-bottom: 10px; }
  .popup-cluster-item { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; }
  .popup-cluster-item:last-child { border-bottom: none; }
  .popup-cluster-item strong { display: block; color: var(--text); }

  /* Marker styles */
  .marker-precise { background: var(--accent); }
  .marker-fallback { background: #b08a4e; }

  .legend {
    position: absolute; bottom: 28px; left: 14px; z-index: 900;
    background: var(--panel); border-radius: 10px; padding: 10px 14px;
    box-shadow: var(--shadow); font-size: 0.78rem; display: flex; flex-direction: column; gap: 6px;
    border: 1px solid var(--border);
  }
  .legend-title { font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.68rem; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .legend-item { cursor: pointer; user-select: none; transition: opacity 0.15s; }
  .legend-item.off { opacity: 0.4; text-decoration: line-through; }
  .legend { max-width: 260px; }
  .legend-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag-chip {
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 999px; padding: 2px 9px; font: inherit; font-size: 0.72rem;
    cursor: pointer; user-select: none; transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .tag-chip:hover { border-color: var(--accent2); }
  .tag-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .popup-row { font-size: 0.8rem; line-height: 1.45; margin-bottom: 5px; word-break: break-word; }
  .popup-row-label { display: block; font-size: 0.66rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .popup-row a { color: var(--accent); text-decoration: none; }
  .popup-row a:hover { text-decoration: underline; }

  .map-wrap { flex: 1; position: relative; display: flex; overflow: hidden; }
  #map { flex: 1; }

  .side-panel {
    position: relative; flex: 0 0 320px;
    width: 280px; background: var(--panel);
    border-left: 1px solid var(--border);
    box-shadow: -4px 0 20px rgba(0,0,0,0.07);
    display: none; flex-direction: column;
    z-index: 800;
  }
  .side-panel.visible { display: flex; }

  .side-panel-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .side-panel-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1rem; color: var(--accent);
  }
  .side-panel-count {
    font-size: 0.72rem; color: var(--muted); margin-top: 2px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .zoom-all { color: var(--accent); text-decoration: none; white-space: nowrap; padding-right: 24px; }
  .zoom-all:hover { text-decoration: underline; }
  .panel-toggle {
    display: flex; gap: 0;
    border: 1.5px solid var(--border); border-radius: 7px; overflow: hidden;
    width: fit-content;
  }
  .panel-toggle button {
    background: none; border: none; padding: 4px 10px;
    font-family: inherit; font-size: 0.72rem; color: var(--muted);
    cursor: pointer; transition: background 0.15s, color 0.15s;
    border-right: 1px solid var(--border);
  }
  .panel-toggle button:last-child { border-right: none; }
  .panel-toggle button.active {
    background: var(--accent); color: white;
  }
  .side-panel-list {
    overflow-y: auto; flex: 1; padding: 8px 0;
  }
  .side-panel-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .side-panel-item:last-child { border-bottom: none; }
  .side-panel-item:hover { background: var(--bg); }
  .side-panel-item-text { min-width: 0; flex: 1; }
  .side-panel-pin { flex-shrink: 0; display: block; }
  .side-panel-item-name {
    font-size: 0.85rem; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .side-panel-item-loc {
    font-size: 0.75rem; color: var(--muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .resource-control-label { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }

  /* .map-style-select {
    border: 1.5px solid var(--border); border-radius: 8px; padding: 4px 8px;
    font-family: inherit; font-size: 0.78rem; background: var(--bg); color: var(--muted);
    outline: none; cursor: pointer;
  }
  .map-style-select:focus { border-color: var(--accent2); } */

  .close-button {
    background: none; border: none; font-size: 1.3rem; cursor: pointer;
    color: var(--muted); line-height: 1; padding: 2px 4px; flex-shrink: 0;
    transition: color 0.15s;
  }
  .close-button:hover { color: var(--text); }
  .panel-section { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .panel-section + .panel-section { border-top: 1px solid var(--border); }
  .panel-section.collapsed { flex: none; }
  .panel-section.collapsed .side-panel-list { display: none; }
  .panel-section.collapsed .side-panel-header { border-bottom: none; }
  .caret-button {
    position: absolute; right: 12px; top: 12px; width: 26px; height: 26px;
    background: none; border: none; cursor: pointer; color: var(--muted);
    display: flex; align-items: center; justify-content: center; border-radius: 6px;
  }
  .caret-button:hover { color: var(--text); background: var(--bg); }
  .caret-button::before {
    content: ''; width: 7px; height: 7px;
    border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: rotate(45deg) translate(-1px, -1px); transition: transform 0.2s;
  }
  .panel-section.collapsed .caret-button::before { transform: rotate(-45deg); }
  .side-panel-header { padding-right: 46px; }
  .noaddr-detail { display: none; margin-top: 6px; }
  .side-panel-item.open .noaddr-detail { display: block; }
  .side-panel-item.noaddr { align-items: flex-start; }
  .side-panel-item.noaddr .popup-inner { padding: 0; }
  .side-panel-empty { padding: 10px 16px; font-size: 0.75rem; color: var(--muted); font-style: italic; }
  @media (max-width: 600px) {
    .logo-full { display: none; }
    .logo-short { display: inline; }
    header { padding: 10px 14px; }
    .panel-toggle-wrap { flex-direction: column; align-items: flex-start; gap: 4px; }
    .resource-control-label { font-size: 0.68rem; }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ── CONFIGURATION ──────────────────────────────────────────────────────────────

const sheet_id = '15XdjNAnOWhABvnkO1G-tmJxnRrZwDz4GpB_VEBLAgf4';
// Paste your Google Apps Script Web App URL here after deploying:
// const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyWFYFzwZ6eyQ76vGxgeqdAVlxV4s30RxX9Dlmp4NvufeEDN2F8unxDlX1kr4I1IbXmmA/exec';
// const APPS_SCRIPT_URL_TEST = 'https://script.google.com/macros/s/AKfycbwpo2JWleSpPlyn1pFJq2hcM8NeSPy7ya7fYsYsAzIaLvgh8tsDFQF9xVlURXonjhGTMA/exec';
// ──────────────────────────────────────────────────────────────────────────────

const carHash = "cb1_40w3_1_123c7e637ff349e9ee317c2b";
const locCarHash = "cb1_40w3_2_da5790ccae4026faccd8d681"; // CARTO key for local/non-GitHub hosts (paste yours here)
const tileKey = location.href.includes("github") ? carHash : locCarHash;
let loadFromHash = false;

function getHashView() {
  const m = location.hash.match(/^#([\d.]+)\/([-\d.]+)\/([-\d.]+)$/);
  loadFromHash = !!m;
  return m ? { zoom: +m[1], lat: +m[2], lng: +m[3] } : null;
}

const initView = getHashView() || { zoom: 4, lat: 38.5, lng: -96 };
const map = L.map('map', { zoomSnap: 0.5 }).setView([initView.lat, initView.lng], initView.zoom);

map.on('moveend', () => {
  const c = map.getCenter();
  location.replace(`#${map.getZoom()}/${c.lat.toFixed(4)}/${c.lng.toFixed(4)}`);
});

const MAP_STYLES = {
  minimal: { url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',        filter: '' },
  bw:      { url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',        filter: 'grayscale(1)' },
  dark:    { url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',         filter: '' },
};
const CARTO_ATTR = '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>';

let tileLayer = L.tileLayer(MAP_STYLES.minimal.url + `?key=${tileKey}`, { attribution: CARTO_ATTR, maxZoom: 19 }).addTo(map);

function setMapStyle(key) {
  const style = MAP_STYLES[key] || MAP_STYLES.minimal;
  tileLayer.setUrl(style.url);
  document.querySelector('.leaflet-tile-pane').style.filter = style.filter;
}

let allMarkers = [];
let unplotted = []; // rows with no usable lat/lng, so no pin
let markerLayer = L.layerGroup().addTo(map);
let coordMap = {};

const TYPE_COLORS = {
  'mental health':      '#b78dff', // blue
  'community':          '#ffce15', // orange
  'integrative health': '#1ae5b0', // green
};
const TYPE_LABELS = { 'mental health': 'Mental Health', 'community': 'Community', 'integrative health': 'Integrative Health' };
const DEFAULT_PIN_COLOR = '#7a7a72';
const activeTypes = new Set(Object.keys(TYPE_COLORS));
const activeTags = new Set(); // empty = no tag filtering; otherwise a resource needs at least one selected tag

function rowTags(row) { return (row.tags || '').split(/[,;]/).map(t => t.trim()).filter(Boolean); }
function passesFilters(row) {
  return activeTypes.has(typeKey(row)) && (!activeTags.size || rowTags(row).some(t => activeTags.has(t)));
}

function typeKey(row) { return (row.type || '').trim().toLowerCase(); }
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toUrl(v) { return /^https?:\/\//i.test(v) ? v : 'https://' + v; }

function getLoc(row) { return row.address || ''; }

function pinSVG(color = DEFAULT_PIN_COLOR) {
  return `<svg class="side-panel-pin" xmlns="http://www.w3.org/2000/svg" width="8" height="25" viewBox="0 0 12 38">
    <circle cx="6" cy="6" r="6" fill="${color}"/>
    <rect x="5.25" y="11" width="1.5" height="23" fill="#c0c0cc"/>
    <polygon points="5,34 7,34 6,38" fill="#a8a8b8"/>
    </svg>`;
}

function makeIcon(angle = 0, headColor = DEFAULT_PIN_COLOR, isShifted = false) {
  const shaftColor = isShifted ? '#78788a' : '#c0c0cc';
  const tipColor   = isShifted ? '#606070' : '#a8a8b8';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="12" height="38" viewBox="0 0 12 38"
    style="transform-origin: 6px 38px; transform: rotate(${angle}deg); display: block;">
    <circle cx="6" cy="6" r="6" stroke="white" stroke-width="0.4" fill="${headColor}"/>
    <rect x="5.25" y="11" width="1.5" height="23" fill="${shaftColor}"/>
    <polygon points="5,34 7,34 6,38" fill="${tipColor}"/>
    </svg>`;
  return L.divIcon({
    html: svg, className: '', iconSize: [12, 38], iconAnchor: [6, 38], popupAnchor: [0, -40]
  });
}


let con = false; 
// ── POPUP HTML ─────────────────────────────────────────────────────────────────
function popupHTML(row) {
  const fields = [
    ['Category', row.category],
    ['Agency', row.agency],
    ['Website', row.website && `<a href="${esc(toUrl(row.website))}" target="_blank" rel="noopener">${esc(row.website)}</a>`],
    ['Contact', row.contact],
    ['Address', row.address],
    ['Summary', row.summary],
  ];
  return `<div class="popup-inner">${fields.filter(([, v]) => v).map(([label, v]) =>
    `<div class="popup-row"><span class="popup-row-label">${label}</span>${label === 'Website' ? v : esc(v)}</div>`
  ).join('')}</div>`;
}

// ── FILTERS (legend type toggles) ───────────────────────────────
function applyFilters() {
  allMarkers.forEach(({ marker, row }) => {
    const show = passesFilters(row);
    if (show) {
      if (!markerLayer.hasLayer(marker)) markerLayer.addLayer(marker);
    } else {
      markerLayer.removeLayer(marker);
    }
  });
  updateSidePanel();
}

function buildLegend() {
  const legend = document.getElementById('legend');
  const allTags = [...new Set([...allMarkers.map(m => m.row), ...unplotted].flatMap(rowTags))].sort((a, b) => a.localeCompare(b));
  legend.innerHTML = '<div class="legend-title">Type (click to filter)</div>' +
    Object.keys(TYPE_COLORS).map(k =>
      `<div class="legend-item${activeTypes.has(k) ? '' : ' off'}" data-type="${k}"><div class="legend-dot" style="background:${TYPE_COLORS[k]}"></div>${TYPE_LABELS[k]}</div>`
    ).join('') +
    (allTags.length ? '<div class="legend-title">Tags</div><div class="legend-chips">' +
      allTags.map(t => `<button type="button" class="tag-chip${activeTags.has(t) ? ' on' : ''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('') +
      '</div>' : '');
  legend.querySelectorAll('.legend-item').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.dataset.type;
      if (activeTypes.has(k)) activeTypes.delete(k); else activeTypes.add(k);
      el.classList.toggle('off', !activeTypes.has(k));
      applyFilters();
    });
  });
  legend.querySelectorAll('.tag-chip').forEach(el => {
    el.addEventListener('click', () => {
      const t = el.dataset.tag;
      if (activeTags.has(t)) activeTags.delete(t); else activeTags.add(t);
      el.classList.toggle('on', activeTags.has(t));
      applyFilters();
    });
  });
}
buildLegend();

// ── MAIN LOAD ──────────────────────────────────────────────────────────────────
function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (cls || '');
}

function setProgress(pct) {
  const bar = document.getElementById('progress-bar');
  const fill = document.getElementById('progress-fill');
  if (pct >= 100) {
    fill.style.width = '100%';
    setTimeout(() => bar.classList.add('hidden'), 400);
  } else {
    bar.classList.remove('hidden');
    fill.style.width = pct + '%';
  }
}

async function fetchSheetRows() {
  const url = `https://docs.google.com/spreadsheets/d/${sheet_id}/gviz/tq?tqx=out:json&gid=0`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/)[1]);
  const cols = json.table.cols.map(c => c.label.toLowerCase().trim());
  return json.table.rows.map((r, idx) => {
    const obj = {};
    cols.forEach((col, i) => { obj[col] = r.c[i] && r.c[i].v != null ? String(r.c[i].v).trim() : ''; });
    obj._rowNum = idx + 1; // for debugging (approx, empty rows are skipped in the API response)
    return obj;
  }).filter(r => r.agency);
}

// ── PLACEMENT GROUPS ───────────────────────────────────────────────────────────
// Each group of 3 shares a lat/lng offset: [vertical, rotated-right, rotated-left]
// Groups 0: original | 1: up-right | 2: down-left | 3: up-left | 4: down-right
// After 5 groups (15 pins), cycle back to original with 2x angle, then 3x, etc.
const BASE_ANGLE = 22.15;
const COORD_OFFSETS = [
  [ 0,       0      ],  // original
  [ 0.0001,  0.0001 ],  // up-right
  [-0.0001, -0.0001 ],  // down-left
  [ 0.0001, -0.0001 ],  // up-left
  [-0.0001,  0.0001 ],  // down-right
];

// ── PLACE MARKER ───────────────────────────────────────────────────────────────
function placeMarker(row, coords) {
  const key = `${coords.lat.toFixed(4)},${coords.lng.toFixed(4)}`;
  const count = coordMap[key] || 0;
  coordMap[key] = count + 1;

  const posInGroup  = count % 3;                          // 0=vert, 1=right, 2=left
  const groupIndex  = Math.floor(count / 3);
  const cycle       = Math.floor(groupIndex / 5);         // angle multiplier round
  const groupInCycle = groupIndex % 5;                    // which spatial offset

  const [dlat, dlng] = COORD_OFFSETS[groupInCycle];
  const isShifted = dlat !== 0 || dlng !== 0;
  const angleMultiplier = cycle + 1;

  const angle = posInGroup === 1 ?  BASE_ANGLE * angleMultiplier
              : posInGroup === 2 ? -BASE_ANGLE * angleMultiplier
              : 0;

  const marker = L.marker(
    [coords.lat + dlat, coords.lng + dlng],
    { icon: makeIcon(angle, TYPE_COLORS[typeKey(row)], isShifted), zIndexOffset: -posInGroup * 100 }
  );
  marker.bindPopup(popupHTML(row), { maxWidth: 320 });
  const θ = angle * Math.PI / 180;
  const tooltipOffset = [Math.round(32 * Math.sin(θ)), Math.round(-32 * Math.cos(θ)) - 10];
  marker.bindTooltip(esc(row.agency), { direction: 'top', offset: tooltipOffset });
  marker.on('click', () => {
    console.log('Marker clicked:', row);
    marker.closeTooltip();
  });
  if (passesFilters(row)) markerLayer.addLayer(marker);
  allMarkers.push({ marker, row });
}

function fitAll() {
  if (!allMarkers.length) return;
  map.fitBounds(L.featureGroup(allMarkers.map(m => m.marker)).getBounds(), { padding: [30, 30] });
}

      // ── SIDE PANEL ─────────────────────────────────────────────────────────────────
      let panelMode = 'visible';

      function setPanelMode(mode) {
        panelMode = mode;
        ['visible', 'hidden'].forEach(m => {
          document.getElementById('pt-' + m).classList.toggle('active', m === mode);
        });
        updateSidePanel();
      }

      function updateSidePanel() {
        const panel = document.getElementById('side-panel');
        const list = document.getElementById('side-panel-list');
        const count = document.getElementById('side-panel-count');

        // The panel takes its own width from the map, so resize the map when it opens/closes
        const wantVisible = panelMode !== 'hidden';
        if (panel.classList.contains('visible') !== wantVisible) {
          panel.classList.toggle('visible', wantVisible);
          map.invalidateSize();
        }

        // Show "zoom out to view all" only if some shown pin is off-screen
        const mapBounds = map.getBounds();
        document.getElementById('zoom-all').hidden = allMarkers.every(({ marker }) =>
          !markerLayer.hasLayer(marker) || mapBounds.contains(marker.getLatLng()));

        if (!wantVisible) return;

        renderNoAddress();

        const bounds = map.getBounds();

        const inView = allMarkers.filter(({ marker, row }) => {
          if (!markerLayer.hasLayer(marker)) return false;
          return bounds.contains(marker.getLatLng());
        }).sort((a, b) => (a.row.agency || '').localeCompare(b.row.agency || ''));

        count.textContent = `${inView.length} resource${inView.length !== 1 ? 's' : ''}`;
        list.innerHTML = inView.map(({ marker, row }) => {
          const loc = getLoc(row);
          return `<div class="side-panel-item" data-lat="${marker.getLatLng().lat}" data-lng="${marker.getLatLng().lng}">
      ${pinSVG(TYPE_COLORS[typeKey(row)])}
      <div class="side-panel-item-text">
        <div class="side-panel-item-name">${esc(row.agency)}</div>
        ${loc ? `<div class="side-panel-item-loc">${esc(loc)}</div>` : ''}
      </div>
    </div>`;
        }).join('');

        list.querySelectorAll('.side-panel-item').forEach((el, i) => {
          el.addEventListener('click', () => inView[i].marker.openPopup());
        });

      }

      function toggleSection(id) {
        const sec = document.getElementById(id);
        const collapsed = sec.classList.toggle('collapsed');
        sec.querySelector('.caret-button').setAttribute('aria-expanded', String(!collapsed));
      }

      function renderNoAddress() {
        const rows = unplotted
          .filter(passesFilters)
          .sort((a, b) => (a.agency || '').localeCompare(b.agency || ''));
        document.getElementById('noaddr-count').textContent = `${rows.length} resource${rows.length !== 1 ? 's' : ''}`;
        const list = document.getElementById('noaddr-list');
        list.innerHTML = rows.length ? rows.map(row => `<div class="side-panel-item noaddr">
      ${pinSVG(TYPE_COLORS[typeKey(row)])}
      <div class="side-panel-item-text">
        <div class="side-panel-item-name">${esc(row.agency)}</div>
        ${row.category ? `<div class="side-panel-item-loc">${esc(row.category)}</div>` : ''}
        <div class="noaddr-detail">${popupHTML(row)}</div>
      </div>
    </div>`).join('') : '<div class="side-panel-empty">None</div>';
        list.querySelectorAll('.side-panel-item').forEach(el => {
          el.addEventListener('click', e => { if (!e.target.closest('a')) el.classList.toggle('open'); });
        });
      }

      document.getElementById('zoom-all').addEventListener('click', e => {
        e.preventDefault();
        fitAll();
      });

      map.on('moveend', updateSidePanel);

loadData();
